<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тёплый Ручей — прототип</title>
<style>
html,body{margin:0;height:100%;background:#1b1a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:bold 22px system-ui,sans-serif;color:#fff6e0;background:rgba(60,40,20,.45);border:3px solid rgba(255,230,180,.55);touch-action:none;box-sizing:border-box;cursor:pointer}
.btn.on{background:rgba(255,200,120,.6)}
#bA{width:86px;height:86px;right:26px;bottom:30px;font-size:36px}
#bR{width:60px;height:60px;right:124px;bottom:20px;font-size:26px}
#bM{width:60px;height:60px;right:40px;bottom:130px;font-size:24px;border-color:rgba(150,200,255,.7);background:rgba(30,50,90,.45)}
#bF{width:42px;height:42px;right:12px;top:12px;font-size:20px;border-radius:10px}
#bC{width:42px;height:42px;right:62px;top:12px;font-size:20px;border-radius:10px}
.desk #bC{right:12px}
#badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:#e8434b;color:#fff;font-size:12px;line-height:18px;text-align:center;display:none;padding:0 3px}
#joy{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
#base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,230,180,.45);background:rgba(60,40,20,.25);display:none;box-sizing:border-box}
#knob{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,230,180,.65);display:none}
.desk #joy,.desk #bA,.desk #bR,.desk #bM,.desk #bF{display:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,18,30,.84);color:#ffeccc;font-family:system-ui,sans-serif;text-align:center;z-index:5}
#start h1{font-size:38px;margin:0 0 6px;letter-spacing:1px;color:#ffd27a;text-shadow:3px 3px 0 #5a3418}
#start .sub{opacity:.7;margin-bottom:14px;font-size:14px}
#start p{margin:3px 14px;font-size:15px;opacity:.9}
#start .go{margin-top:18px;padding:12px 30px;border:3px solid #ffd27a;border-radius:12px;font-size:19px;color:#ffd27a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,12,22,.6);z-index:4;font-family:system-ui,sans-serif;color:#f5e6c8}
#panel.open{display:flex}
.card{width:min(560px,94vw);max-height:92vh;overflow:auto;background:#2b2033;border:3px solid #c99a4a;border-radius:14px;box-shadow:0 8px 0 #160f1c;padding:14px 16px;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd b{font-size:22px;color:#ffd27a}
.hd span{opacity:.8}
.hd button{margin-left:auto}
.card button{font:bold 18px system-ui;color:#2b2033;background:#ffd27a;border:0;border-radius:8px;min-width:38px;height:36px;cursor:pointer}
.card button:disabled{background:#5b4a5e;color:#8f7f92;cursor:default}
#ppts{margin:4px 0 10px;font-size:15px}
#ppts em{color:#ffd27a;font-style:normal;font-weight:bold}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.stats{flex:1 1 250px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #43344a}
.row .n{flex:1}
.row .n b{display:block;font-size:16px}
.row .n small{opacity:.65;font-size:12px}
.row .v{font:bold 22px system-ui;width:36px;text-align:right;color:#fff}
.der{flex:1 1 180px;background:#231a2a;border-radius:10px;padding:8px 12px;font-size:14px}
.der div{display:flex;justify-content:space-between;padding:3px 0}
.der div span:last-child{font-weight:bold;color:#fff}
.der h4{margin:2px 0 6px;color:#c99a4a;font-size:13px;text-transform:uppercase;letter-spacing:1px}
#start .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
#start .btns button{font:bold 18px system-ui,sans-serif;padding:11px 26px;border:3px solid #ffd27a;border-radius:12px;color:#ffd27a;background:transparent;cursor:pointer}
#start .btns button.main{background:#ffd27a;color:#2b2033}
.row .lt{width:30px;height:30px;border-radius:8px;background:#ffd27a;color:#2b2033;font:900 18px system-ui;display:flex;align-items:center;justify-content:center;flex:none}
.row .ctl{display:flex;gap:6px;align-items:center}
.row{padding:5px 0}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.presets button{font-size:14px;height:30px;padding:0 10px;background:#43344a;color:#f5e6c8}
.perks{margin-top:12px}
.perks h4{margin:4px 0 8px;color:#c99a4a;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pk{flex:1 1 150px;background:#3a2b44;border:2px solid #c99a4a;border-radius:10px;padding:8px 10px;cursor:pointer}
.pk b{display:block;color:#ffd27a}
.pk small{opacity:.8}
.pk i{display:block;font-style:normal;font-size:11px;opacity:.55;margin-top:3px}
.taken{display:flex;gap:6px;flex-wrap:wrap}
.taken span{background:#43344a;border-radius:8px;padding:4px 8px;font-size:13px}
.foot{margin-top:12px;display:flex;justify-content:flex-end}
.foot button{padding:0 22px;height:42px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="joy"><div id="base"></div><div id="knob"></div></div>
  <div class="btn" id="bM">✦</div>
  <div class="btn" id="bR">⟳</div>
  <div class="btn" id="bA">⚔</div>
  <div class="btn" id="bC">👤<span id="badge"></span></div>
  <div class="btn" id="bF">⛶</div>
</div>
<div id="panel"><div class="card">
  <div class="hd"><b>Герой</b><span id="plvl"></span><button id="pclose">✕</button></div>
  <div id="ppts"></div>
  <div class="perks" id="pchoice"></div><div id="ppre"></div><div class="cols"><div class="stats" id="pstats"></div><div class="der" id="pder"></div></div><div class="perks" id="pperks"></div><div class="foot" id="pfoot"></div>
</div></div>
<div id="start">
  <h1>Тёплый Ручей</h1>
  <div class="sub">прототип · система S.P.E.C.I.A.L.</div>
  <div id="help"></div>
  <div class="btns" id="sbtns"></div>
</div>
<script>
"use strict";
// ---------- setup ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(!TOUCH)document.body.classList.add('desk');
document.getElementById('help').innerHTML=TOUCH
 ?'<p>Джойстик — слева, где коснёшься</p><p>⚔ — меч, ✦ — огонёк, ⟳ — кувырок</p><p>👤 — герой: параметры и перки</p><p>Лучше держать телефон горизонтально</p>'
 :'<p>WASD / стрелки — ходить</p><p>Пробел / J — меч, E / L — огонёк, Shift / K — кувырок</p><p>C — герой: параметры и перки</p>';
// The canvas is full device resolution; the pixel-art world is drawn scaled by S.
// Positions are snapped to 1/S of an art pixel, so movement is smooth, not 1-art-pixel jumps.
let VW=320,VH=180,S=1;
function resize(){
  const dpr=devicePixelRatio||1;
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
  S=Math.max(1,Math.round(Math.min(cv.width,cv.height)/180));
  VW=cv.width/S;VH=cv.height/S;
}
addEventListener('resize',resize);resize();
addEventListener('contextmenu',e=>e.preventDefault());
const q=v=>Math.round(v*S)/S;

let seed=12345;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}

// ---------- map ----------
const T=16,MW=48,MH=32;
const GRASS=0,PATH=1,WATER=2,TREE=3,HOUSE=4,FLOWER=5,SAND=6;
const map=new Uint8Array(MW*MH);
const at=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?TREE:map[y*MW+x];
const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)map[y*MW+x]=v};
const houses=[[4,5],[15,5],[4,13],[15,13]];
const FIRE={x:10*T+8,y:8*T+10};
const SPAWN={x:10*T+8,y:10*T+14};
function gen(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const e=Math.min(x,y,MW-1-x,MH-1-y);
    if(e<2||(e<3&&rnd()<.5))set(x,y,TREE);
  }
  for(let y=2;y<MH-2;y++)for(let x=37;x<MW-2;x++)if(rnd()<.33)set(x,y,TREE);
  for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++)if(at(x,y)===GRASS&&rnd()<.03)set(x,y,TREE);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const d=((x-27)/6)**2+((y-23)/3.6)**2;
    if(d<1)set(x,y,WATER);else if(d<1.5&&x>1&&y>1&&x<MW-2&&y<MH-2)set(x,y,SAND);
  }
  for(let y=2;y<19;y++)for(let x=2;x<21;x++)if(at(x,y)===TREE&&x>2&&y>2)set(x,y,GRASS);
  for(let x=2;x<MW-2;x++){set(x,10,PATH);set(x,11,PATH)}
  for(let y=3;y<MH-2;y++){set(12,y,PATH);set(13,y,PATH)}
  for(const[hx,hy]of houses)for(let j=0;j<3;j++)for(let i=0;i<4;i++)set(hx+i,hy+j,HOUSE);
  set(10,8,GRASS);set(10,9,GRASS);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(at(x,y)===GRASS&&rnd()<.07)set(x,y,FLOWER);
}
gen();

function pEll(g,cxp,cyp,w,h,col){
  g.fillStyle=col;const top=-Math.round(h/2);
  for(let j=0;j<h;j++){const t=(j+.5)/h*2-1;const hw=Math.round(w/2*Math.sqrt(Math.max(0,1-t*t)));
    if(hw>0)g.fillRect(cxp-hw,cyp+top+j,hw*2,1)}
}
const mapCv=document.createElement('canvas');mapCv.width=MW*T;mapCv.height=MH*T;
(function render(){
  const g=mapCv.getContext('2d');
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=at(x,y),px=x*T,py=y*T;
    if(t===PATH){R(px,py,16,16,'#d8b878');
      for(let i=0;i<4;i++)R(px+(rnd()*15|0),py+(rnd()*15|0),1+(rnd()*2|0),1,rnd()<.5?'#c29c5e':'#e8cf9a');
      if(at(x,y-1)!==PATH&&at(x,y-1)!==HOUSE)for(let i=0;i<16;i+=2)R(px+i,py,1+(rnd()*2|0),1+(rnd()*2|0),'#6cbb48');
      if(at(x,y+1)!==PATH&&at(x,y+1)!==HOUSE)for(let i=0;i<16;i+=2)R(px+i,py+15-(rnd()*2|0),1,2,'#6cbb48');
      if(at(x-1,y)!==PATH&&at(x-1,y)!==HOUSE)for(let i=0;i<16;i+=2)R(px,py+i,1+(rnd()*2|0),1,'#6cbb48');
      if(at(x+1,y)!==PATH&&at(x+1,y)!==HOUSE)for(let i=0;i<16;i+=2)R(px+15-(rnd()*2|0),py+i,2,1,'#6cbb48');
    }else if(t===WATER){R(px,py,16,16,'#3f86d0');
      for(let i=0;i<3;i++)R(px+(rnd()*12|0),py+(rnd()*15|0),3,1,'#6aaee8');
      if(at(x,y-1)!==WATER)R(px,py,16,2,'#8cc6ef');
    }else if(t===SAND){R(px,py,16,16,'#e6d199');
      for(let i=0;i<4;i++)R(px+(rnd()*15|0),py+(rnd()*15|0),1,1,'#d1b675');
    }else{R(px,py,16,16,'#6cbb48');
      for(let i=0;i<5;i++)R(px+(rnd()*15|0),py+(rnd()*14|0),1,2,rnd()<.5?'#5aa23b':'#83cf5d');
      if(t===FLOWER){const cols=['#ff8fb1','#fff3a8','#ffffff','#c9a0ff'];
        for(let i=0;i<2;i++){const fx=px+2+(rnd()*11|0),fy=py+2+(rnd()*11|0),c=cols[rnd()*4|0];
          R(fx-1,fy,3,1,c);R(fx,fy-1,1,3,c);R(fx,fy,1,1,'#ffb52e');R(fx,fy+2,1,1,'#3f8a33')}}
    }
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(at(x,y)===TREE){
    const px=x*T,py=y*T;
    R(px+6,py+10,4,6,'#7a4a26');R(px+6,py+10,1,6,'#5e381c');
    pEll(g,px+8,py+7,16,13,'#235e2c');pEll(g,px+8,py+6,15,11,'#2e7838');
    pEll(g,px+6,py+4,9,6,'#3f9a45');R(px+4,py+2,2,1,'#62bd5e');R(px+9,py+3,1,1,'#62bd5e');
  }
  for(const[hx,hy]of houses){const px=hx*T,py=hy*T;
    R(px+46,py-3,6,9,'#8a6a5a');R(px+45,py-4,8,2,'#6b4f42');
    R(px+4,py+20,56,28,'#ecd9b2');R(px+4,py+44,56,4,'#d3b98a');
    for(let j=0;j<5;j++)R(px+4,py+24+j*5,56,1,'#dcc59a');
    R(px,py+2,64,20,'#c4523d');R(px+3,py,58,3,'#a8402f');
    for(let j=6;j<20;j+=5)R(px,py+j,64,1,'#a8402f');
    for(let j=0;j<20;j+=5)for(let i=(j%10?4:0);i<64;i+=8)R(px+i,py+2+j,1,4,'#b04837');
    R(px,py+21,64,2,'#7e2e22');
    R(px+26,py+30,12,18,'#6b3d1f');R(px+27,py+31,10,17,'#7d4826');R(px+34,py+39,2,2,'#e8c060');
    for(const wx of[9,43]){R(px+wx,py+28,12,10,'#5b3a1f');R(px+wx+1,py+29,10,8,'#9fd8ff');R(px+wx+5,py+29,1,8,'#5b3a1f');R(px+wx+1,py+32,10,1,'#5b3a1f');R(px+wx+2,py+30,2,1,'#e6f6ff')}
  }
})();

// ---------- audio ----------
let AC=null;
function snd(f1,f2,d,type,v){if(!AC)return;try{const t=AC.currentTime,os=AC.createOscillator(),g=AC.createGain();os.type=type||'square';
  os.frequency.setValueAtTime(f1,t);os.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);os.connect(g);g.connect(AC.destination);os.start(t);os.stop(t+d+.02)}catch(e){}}

// ---------- hero & stats: S.P.E.C.I.A.L. ----------
const SP=[
  ['S','str','Сила','урон мечом, отбрасывание'],
  ['P','per','Восприятие','дальность и урон огонька, криты'],
  ['E','end','Выносливость','здоровье, защита, восстановление'],
  ['C','cha','Обаяние','слаймы реже нападают, больше монет'],
  ['I','int','Интеллект','мана, сила огонька, опыт'],
  ['A','agi','Ловкость','скорость, частота ударов, кувырок'],
  ['L','luck','Удача','шанс крита и добыча'],
];
const PERKS=[
  {id:'heavy',n:'Тяжёлая рука',d:'+25% урона мечом',req:{str:6}},
  {id:'brawler',n:'Задира',d:'меч отбрасывает дальше и оглушает',req:{str:4}},
  {id:'pierce',n:'Меткий глаз',d:'огонёк пробивает врагов насквозь',req:{per:6}},
  {id:'scout',n:'Разведчик',d:'+10% к скорости',req:{per:4}},
  {id:'thick',n:'Толстокожий',d:'+3 к защите',req:{end:6}},
  {id:'life',n:'Жажда жизни',d:'сердечки лечат вдвое больше',req:{end:4}},
  {id:'charm',n:'Душа компании',d:'+50% монет',req:{cha:6}},
  {id:'peace',n:'Миротворец',d:'слаймы замечают тебя вдвое ближе',req:{cha:4}},
  {id:'mage',n:'Ученик мага',d:'огонёк дешевле на 2 маны и сильнее на 20%',req:{int:6}},
  {id:'learner',n:'Прилежный ученик',d:'+15% опыта',req:{int:4}},
  {id:'swift',n:'Шустрый',d:'кувырок перезаряжается вдвое быстрее',req:{agi:6}},
  {id:'dancer',n:'Танцор с мечом',d:'на ходу с мечом не замедляешься',req:{agi:4}},
  {id:'lucky',n:'Везунчик',d:'криты бьют ×2.5 вместо ×1.8',req:{luck:6}},
  {id:'thrift',n:'Бережливый',d:'сердечки и зелья выпадают вдвое чаще',req:{luck:4}},
];
const SPN={str:'S',per:'P',end:'E',cha:'C',int:'I',agi:'A',luck:'L'};
const SPMIN=1,SPMAX=10,CREATE_PTS=5;
const P={x:SPAWN.x,y:SPAWN.y,dir:'down',lvl:1,xp:0,pts:0,coins:0,
  st:{str:5,per:5,end:5,cha:5,int:5,agi:5,luck:5},perks:[],perkPicks:0,perkChoice:null,
  hp:0,mp:0,atk:0,atkCd:0,castCd:0,roll:0,rollCd:0,rvx:0,rvy:0,inv:0,walk:0,moving:0,kx:0,ky:0,dead:0,calm:0};
const has=id=>P.perks.includes(id);
const D={
  maxHp:()=>20+P.st.end*8+(P.lvl-1)*(3+P.st.end),
  maxMp:()=>10+P.st.int*5,
  melee:()=>(3+P.st.str*2)*(has('heavy')?1.25:1),
  knock:()=>150+P.st.str*12+(has('brawler')?120:0),
  spell:()=>(4+P.st.int*2+P.st.per*.5)*(has('mage')?1.2:1),
  spellCost:()=>has('mage')?4:6,
  range:()=>.5+P.st.per*.08,
  crit:()=>Math.min(.6,.02+P.st.luck*.015+P.st.per*.005),
  critMul:()=>has('lucky')?2.5:1.8,
  def:()=>Math.floor(P.st.end/2)+(has('thick')?3:0),
  speed:()=>(64+P.st.agi*2)*(has('scout')?1.1:1),
  atkCd:()=>Math.max(.18,.40-P.st.agi*.012),
  rollCd:()=>(.8-P.st.agi*.03)*(has('swift')?.5:1),
  mpRegen:()=>.4+P.st.int*.15,
  hpRegen:()=>P.st.end*.2,
  xpMul:()=>1+P.st.int*.03+(has('learner')?.15:0),
  aggro:()=>(115-P.st.cha*4)*(has('peace')?.5:1),
  coinMul:()=>1+P.st.cha*.06+(has('charm')?.5:0),
  dropCh:()=>(.1+P.st.luck*.015)*(has('thrift')?2:1),
};
const xpNeed=()=>10+(P.lvl-1)*8;
P.hp=D.maxHp();P.mp=D.maxMp();
function rollDmg(base){const crit=Math.random()<D.crit();return{d:Math.max(1,Math.round(base*(.85+Math.random()*.3)*(crit?D.critMul():1))),crit}}

// ---------- save ----------
const SAVE_KEY='teplyruchey_save_v2';
function save(){if(!running)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({x:P.x,y:P.y,lvl:P.lvl,xp:P.xp,pts:P.pts,coins:P.coins,st:P.st,perks:P.perks,perkPicks:P.perkPicks,perkChoice:P.perkChoice,hp:P.hp,mp:P.mp}))}catch(_){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.st&&s.lvl?s:null}catch(_){return null}}

// ---------- input ----------
const keys={};let rollQ=0,btnAtk=0,castQ=0,paused=false;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(!e.repeat){if(['ShiftLeft','ShiftRight','KeyK','KeyX'].includes(e.code))rollQ=1;
    if(['KeyE','KeyL'].includes(e.code))castQ=1;
    if(e.code==='KeyC'||e.code==='Tab'){togglePanel();return}
    if(e.code==='Escape'&&paused){togglePanel(false);return}}

function update(dt){
  time+=dt;if(hintT>0)hintT-=dt;if(banner&&(banner.t-=dt)<=0)banner=null;shake=Math.max(0,shake-dt);
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.KeyA)ix--;if(keys.ArrowRight||keys.KeyD)ix++;if(keys.ArrowUp||keys.KeyW)iy--;if(keys.ArrowDown||keys.KeyS)iy++;
  ix+=joy.x;iy+=joy.y;let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;len=1}
  const atkHeld=keys.Space||keys.KeyJ||keys.KeyZ||btnAtk;
  if(P.dead>0){P.dead-=dt;if(P.dead<=0){respawn();save()}rollQ=castQ=0}
  else{
    P.atkCd-=dt;P.rollCd-=dt;P.castCd-=dt;P.inv-=dt;if(P.atk>0)P.atk-=dt;
    P.mp=Math.min(D.maxMp(),P.mp+D.mpRegen()*dt);P.calm+=dt;if(P.calm>4)P.hp=Math.min(D.maxHp(),P.hp+D.hpRegen()*dt);
    if(rollQ&&P.rollCd<=0&&P.atk<=0){let vx,vy;if(len>.2){vx=ix/len;vy=iy/len}else[vx,vy]=DV[P.dir];
      P.rvx=vx*175;P.rvy=vy*175;P.roll=.26;P.rollCd=D.rollCd();P.inv=Math.max(P.inv,.3);snd(300,500,.1,'triangle',.04)}
    rollQ=0;

    else{
      if(castQ&&P.castCd<=0&&P.atk<=0)doCast();
      if(atkHeld&&P.atkCd<=0)doAttack();
      if(len>.15){if(P.atk<=0){if(Math.abs(ix)>Math.abs(iy)*1.1)P.dir=ix>0?'right':'left';else if(Math.abs(iy)>Math.abs(ix)*1.1)P.dir=iy>0?'down':'up'}
        const sp=D.speed()*(P.atk>0&&!has('dancer')?.35:1)*Math.min(1,len*1.3),x0=P.x,y0=P.y;

    }
    castQ=0;
    if(P.kx||P.ky){moveBox(P,P.kx*dt,P.ky*dt,8,5);const f=Math.pow(.002,dt);P.kx*=f;P.ky*=f;if(Math.abs(P.kx)+Math.abs(P.ky)<4)P.kx=P.ky=0}
  }
  // smooth, frame-rate independent camera
  const k=1-Math.exp(-dt*10);

  camX=Math.max(0,Math.min(MW*T-VW,camX));camY=Math.max(0,Math.min(MH*T-VH,camY));

  for(const e of enemies){
    e.flash-=dt;e.t-=dt;
    if(e.z>0||e.vz>0){e.vz-=420*dt;e.z+=e.vz*dt;if(e.z<=0){e.z=0;e.vz=0;e.vx=e.vy=0}}

      if(aggro)a=Math.atan2(dy,dx)+(Math.random()-.5)*.4;else if(Math.random()<.6)a=Math.random()*6.28;
      if(a!==undefined){const sp=e.blue?80:58;e.vx=Math.cos(a)*sp;e.vy=Math.sin(a)*sp;e.vz=115}
      e.t=aggro?(e.blue?.55:.75)+Math.random()*.3:1+Math.random()*1.5;
    }
    moveBox(e,(e.vx+e.kx)*dt,(e.vy+e.ky)*dt,10,5);

    if(Math.random()<.6)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,life:.3,max:.3,col:Math.random()<.5?'#ffb03a':'#ffe08a',sz:1});
    if(solid(b.x,b.y+5)){b.life=0;burst(b.x,b.y,'#ffb03a',8,50)}
    for(const e of enemies)if(b.life>0&&e.hp>0&&!b.hit.includes(e)&&Math.abs(e.x-b.x)<8&&Math.abs(e.y-5-e.z-b.y)<8){
      b.hit.push(e);if(!has('pierce'))b.life=0;burst(b.x,b.y,'#ff8a3a',10,60);const l=Math.hypot(b.vx,b.vy);damageEnemy(e,D.spell(),b.vx/l*150,b.vy/l*150)}
  }
  bolts=bolts.filter(b=>b.life>0);enemies=enemies.filter(e=>e.hp>0);
  spawnT-=dt;if(spawnT<=0){spawnT=4;if(enemies.length<9)spawnSlime();save()}
  for(const it of items){it.t+=dt;
    if(it.z>0||it.vz){it.vz-=320*dt;it.z+=it.vz*dt;moveBox(it,it.vx*dt,it.vy*dt,4,3);if(it.z<0){it.z=0;it.vz=-it.vz*.45;it.vx*=.5;it.vy*=.5;if(Math.abs(it.vz)<25){it.vz=0;it.vx=it.vy=0}}}
    if(P.dead>0||it.t<.35)continue;
    const dx=P.x-it.x,dy=P.y-it.y,d=Math.hypot(dx,dy);
    if(d<30){it.x+=dx/d*130*dt;it.y+=dy/d*130*dt}
    if(d<7){it.got=1;
      if(it.kind==='coin'){P.coins++;snd(988,1318,.12,'square',.04);ftext(P.x,P.y-20,'+1','#ffd94a',5,.6)}
      else if(it.kind==='heart'){const h=Math.round(D.maxHp()*(has('life')?.5:.25));P.hp=Math.min(D.maxHp(),P.hp+h);snd(660,990,.2,'triangle',.06);ftext(P.x,P.y-20,'+'+h+' ♥','#ff8a8a',6,.8)}
      else{const m=Math.round(D.maxMp()*.3);P.mp=Math.min(D.maxMp(),P.mp+m);snd(700,1100,.2,'triangle',.06);ftext(P.x,P.y-20,'+'+m+' маны','#8fc4ff',5,.8)}}
  }
  items=items.filter(i=>!i.got);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.vx*=.96;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.y-=18*dt;t.life-=dt}
  texts=texts.filter(t=>t.life>0);
}

// ---------- drawing ----------
const C={skin:'#f2c79a',hair:'#7a4320',hairL:'#9c5a2c',tunic:'#3f8f4f',tunicD:'#2f6e3c',belt:'#6b3d1f',pants:'#4a3a6a',pantsD:'#3a2d55',boot:'#3b2615',eye:'#2a1d1a'};
let ox=0,oy=0,fl=false,CX=0,CY=0;
const wx=x=>q(x)-CX,wy=y=>q(y)-CY;
function r(a,b,w,h,c){cx.fillStyle=c;cx.fillRect(fl?ox+16-a-w:ox+a,oy+b,w,h)}

function drawHero(){
  if(P.dead>0)return;
  ox=wx(P.x)-8;oy=wy(P.y)-16;fl=P.dir==='left';
  cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(ox+4,oy+15,8,2);cx.fillRect(ox+3,oy+16,10,1);
  if(P.inv>0&&P.roll<=0&&Math.floor(P.inv*14)%2===0)return;
  if(P.roll>0){const a=(1-P.roll/.26)*Math.PI*2*(P.rvx<0?-1:1);
    pEll(cx,ox+8,oy+10,11,11,C.tunicD);pEll(cx,ox+8,oy+10,9,9,C.tunic);
    cx.fillStyle=C.hair;cx.fillRect(ox+7+Math.round(Math.cos(a)*3),oy+9+Math.round(Math.sin(a)*3),3,3);
    cx.fillStyle=C.skin;cx.fillRect(ox+7-Math.round(Math.cos(a)*3),oy+9-Math.round(Math.sin(a)*3),2,2);return}
  // walk cycle advances by distance travelled: one frame per 4 px, 4 frames
  const f=P.moving?Math.floor(P.walk/4)%4:0,lA=f===1?-1:0,lB=f===3?-1:0,aS=f===1?1:f===3?-1:0;
  const d=P.dir;
  if(d==='down'||d==='up'){
    r(5,12+lA,2,2,C.pants);r(5,14+lA,2,1,C.boot);r(9,12+lB,2,2,C.pants);r(9,14+lB,2,1,C.boot);
    r(4,7,8,5,C.tunic);r(4,11,8,1,C.tunicD);r(4,10,8,1,C.belt);
    r(3,8+aS,1,3,C.tunicD);r(3,11+aS,1,1,C.skin);r(12,8-aS,1,3,C.tunicD);r(12,11-aS,1,1,C.skin);
    r(4,1,8,6,C.skin);
    if(d==='down'){r(4,0,8,3,C.hair);r(4,3,1,2,C.hair);r(11,3,1,2,C.hair);r(5,0,6,1,C.hairL);r(6,4,1,2,C.eye);r(9,4,1,2,C.eye);r(5,6,1,1,'#f0a888');r(10,6,1,1,'#f0a888')}
    else{r(4,0,8,6,C.hair);r(5,0,6,1,C.hairL);r(5,6,6,1,C.skin)}
  }else{
    r(6,12+lA,2,2,C.pants);r(6,14+lA,2,1,C.boot);r(8,12+lB,2,2,C.pantsD);r(8,14+lB,2,1,C.boot);
    r(5,7,6,5,C.tunic);r(5,11,6,1,C.tunicD);r(5,10,6,1,C.belt);
    r(4,1,8,6,C.skin);r(4,0,8,3,C.hair);r(4,3,4,3,C.hair);r(5,0,6,1,C.hairL);r(10,4,1,2,C.eye);r(10,6,1,1,'#f0a888');
    r(7+aS,8,2,3,C.tunicD);r(7+aS,11,2,1,C.skin);
  }
}
function drawSlash(){
  if(P.atk<=0||P.dead>0)return;
  const p=1-P.atk/.2,base={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[P.dir];
  const a0=base-1.3,a=a0+2.6*Math.min(1,p*1.3),sx=wx(P.x),sy=wy(P.y)-7;
  for(let s=1;s<7;s++){const aa=a-s*.16;if(aa<a0)break;cx.fillStyle='rgba(255,255,255,'+(.55-s*.07)+')';
    for(let rr=8;rr<=14;rr++)cx.fillRect(sx+Math.round(Math.cos(aa)*rr),sy+Math.round(Math.sin(aa)*rr),1,1)}
  for(let rr=2;rr<=14;rr++){cx.fillStyle=rr<5?'#7a4a26':rr===5?'#e0b040':'#e8f4ff';
    cx.fillRect(sx+Math.round(Math.cos(a)*rr),sy+Math.round(Math.sin(a)*rr),1,1)}
}
function drawSlime(e){
  const sx=wx(e.x),sy=wy(e.y),z=Math.round(e.z);
  pEll(cx,sx,sy,Math.max(6,11-Math.round(z/4)),3,'rgba(0,0,0,.22)');
  const br=e.z>0?0:Math.round(Math.sin(time*4+e.ph));
  const w=e.z>0?10:12+br,h=e.z>0?11:8-br;
  const col=e.flash>0?'#ffffff':e.blue?'#5fa8ff':'#7ad35a',dk=e.flash>0?'#dddddd':e.blue?'#3d6fc4':'#4c9e3a',lt=e.blue?'#d0e8ff':'#d2f7b8';
  const cy=sy-z-Math.round(h/2);
  pEll(cx,sx,cy,w,h,dk);pEll(cx,sx,cy-1,w-2,h-1,col);
  cx.fillStyle=lt;cx.fillRect(sx-Math.round(w/2)+2,cy-Math.round(h/2)+2,2,2);
  const ex=Math.sign(P.x-e.x);cx.fillStyle='#1d2a1a';
  cx.fillRect(sx-3+ex,cy-1,1,2);cx.fillRect(sx+2+ex,cy-1,1,2);
  if(e.hp<e.max){const by=cy-Math.round(h/2)-5;cx.fillStyle='#2a2238';cx.fillRect(sx-7,by,14,2);cx.fillStyle='#ff6b6b';cx.fillRect(sx-7,by,Math.max(1,Math.round(14*e.hp/e.max)),2)}
}
function drawItem(it){
  const sx=wx(it.x),sy=wy(it.y),z=Math.round(it.z+(it.vz===0&&it.z===0?Math.sin(time*5+it.x)+1:0));
  cx.fillStyle='rgba(0,0,0,.2)';cx.fillRect(sx-2,sy,4,1);
  if(it.kind==='coin'){const w=Math.abs(Math.cos(time*4+it.x))>.4?4:2;
    cx.fillStyle='#c9952a';cx.fillRect(sx-w/2,sy-z-5,w,4);cx.fillStyle='#f5c542';cx.fillRect(sx-w/2,sy-z-5,w,3);cx.fillStyle='#fff3b0';cx.fillRect(sx-w/2,sy-z-5,1,1)}
  else if(it.kind==='heart')heart(sx-3,sy-z-7);
  else{cx.fillStyle='#2d5fb0';cx.fillRect(sx-2,sy-z-6,4,5);cx.fillRect(sx-1,sy-z-7,2,1);cx.fillStyle='#6fb2ff';cx.fillRect(sx-1,sy-z-5,2,3);cx.fillStyle='#e0f0ff';cx.fillRect(sx-1,sy-z-5,1,1)}
}
function drawBolt(b){const sx=wx(b.x),sy=wy(b.y);
  cx.fillStyle='rgba(255,170,60,.35)';cx.fillRect(sx-3,sy-3,6,6);cx.fillStyle='#ff8a2a';cx.fillRect(sx-2,sy-2,4,4);cx.fillStyle='#fff2a0';cx.fillRect(sx-1,sy-1,2,2)}
function drawFire(){
  const sx=wx(FIRE.x),sy=wy(FIRE.y);
  const gl=cx.createRadialGradient(sx,sy-4,1,sx,sy-4,26);gl.addColorStop(0,'rgba(255,190,90,.35)');gl.addColorStop(1,'rgba(255,190,90,0)');
  cx.fillStyle=gl;cx.fillRect(sx-26,sy-30,52,52);
  cx.fillStyle='#8a8378';for(const[a,b]of[[-6,0],[-4,2],[4,2],[6,0],[-1,3],[2,3]])cx.fillRect(sx+a-1,sy+b-1,3,2);
  cx.fillStyle='#6b3d1f';cx.fillRect(sx-5,sy-1,10,2);cx.fillStyle='#5a3218';cx.fillRect(sx-3,sy-2,6,2);
  for(let i=-3;i<=3;i++){const h=Math.max(1,Math.round(5-Math.abs(i)*1.2+Math.sin(time*13+i*2)*1.6));
    cx.fillStyle='#e8562a';cx.fillRect(sx+i,sy-2-h,1,h);
    if(h>2){cx.fillStyle='#ffc23a';cx.fillRect(sx+i,sy-h,1,h-2)}}
  if(running&&!paused&&Math.random()<.15)parts.push({x:FIRE.x+(Math.random()*4-2),y:FIRE.y-6,vx:(Math.random()-.5)*8,vy:-25,life:.6,max:.6,col:'#ffcc55',sz:1});
}
const HS=['.xx.xx.','xxxxxxx','xxxxxxx','.xxxxx.','..xxx..','...x...'];
function heart(x,y){for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(HS[j][i]==='x'){cx.fillStyle=(j===1&&i===1)?'#ffc0c0':'#e8434b';cx.fillRect(x+i,y+j,1,1)}}
function bar(x,y,w,h,v,max,col,bg){cx.fillStyle='#160f1c';cx.fillRect(x-1,y-1,w+2,h+2);cx.fillStyle=bg;cx.fillRect(x,y,w,h);
  cx.fillStyle=col;cx.fillRect(x,y,Math.round(w*Math.max(0,Math.min(1,v/max))*S)/S,h);cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x,y,Math.round(w*Math.max(0,Math.min(1,v/max))*S)/S,1)}
// text is drawn at full device resolution, positions given in art pixels
function otext(s,x,y,size,col,align){cx.font='bold '+Math.round(size*S)+'px system-ui,sans-serif';cx.textAlign=align||'center';cx.textBaseline='middle';
  cx.lineJoin='round';cx.lineWidth=Math.max(2,size*S*.28);cx.strokeStyle='#2a1a12';cx.strokeText(s,x*S,y*S);cx.fillStyle=col;cx.fillText(s,x*S,y*S)}

function render(){
  let shx=0,shy=0;if(shake>0&&!paused){shx=(Math.random()-.5)*4;shy=(Math.random()-.5)*4}
  CX=q(Math.max(0,Math.min(MW*T-VW,camX+shx)));CY=q(Math.max(0,Math.min(MH*T-VH,camY+shy)));
  cx.setTransform(1,0,0,1,0,0);cx.imageSmoothingEnabled=false;
  cx.fillStyle='#1b1a24';cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(S,0,0,S,0,0);
  cx.drawImage(mapCv,-CX,-CY);
  drawFire();
  const list=[];for(const e of enemies)list.push([e.y,()=>drawSlime(e)]);for(const it of items)list.push([it.y,()=>drawItem(it)]);
  list.push([P.y,drawHero]);list.sort((a,b)=>a[0]-b[0]);
  if(P.dir==='up')drawSlash();for(const[,f]of list)f();if(P.dir!=='up')drawSlash();
  for(const b of bolts)drawBolt(b);
  for(const p of parts){cx.globalAlpha=Math.min(1,p.life/p.max*1.5);cx.fillStyle=p.col;cx.fillRect(wx(p.x),wy(p.y),p.sz,p.sz)}
  cx.globalAlpha=1;
  // HUD
  cx.fillStyle='rgba(30,22,40,.6)';cx.fillRect(2,2,82,34);
  bar(6,6,74,6,P.hp,D.maxHp(),'#e8434b','#4a2230');
  bar(6,15,74,4,P.mp,D.maxMp(),'#4f9dff','#1f2a4a');
  bar(6,22,74,2,P.xp,xpNeed(),'#9fe07a','#24331f');
  cx.fillStyle='#c9952a';cx.fillRect(6,27,4,5);cx.fillStyle='#f5c542';cx.fillRect(6,27,4,4);cx.fillStyle='#fff3b0';cx.fillRect(6,27,1,1);
  if(P.dead>0){cx.fillStyle='rgba(20,15,30,'+Math.min(.6,(2-P.dead)*.6)+')';cx.fillRect(0,0,VW,VH)}
  // text layer
  cx.setTransform(1,0,0,1,0,0);
  otext(Math.ceil(P.hp)+' / '+D.maxHp(),43,9.2,5,'#fff');
  otext(Math.floor(P.mp)+' / '+D.maxMp(),43,17.2,3.8,'#e0eeff');
  otext(String(P.coins),13,29.8,5,'#ffe27a','left');
  otext('Ур. '+P.lvl,80,29.8,5,'#bfe9ff','right');
  if((P.pts>0||P.perkPicks>0)&&Math.floor(time*2)%2===0)otext('★ '+(P.perkPicks>0?'новый перк':'очко S.P.E.C.I.A.L.')+(TOUCH?' — нажми 👤':' — нажми C'),4,42,4.6,'#ffd27a','left');
  for(const t of texts){cx.globalAlpha=Math.min(1,t.life/t.max*2);otext(t.s,wx(t.x),wy(t.y),t.size,t.col)}
  cx.globalAlpha=1;
  if(hintT>0&&running){cx.globalAlpha=Math.min(1,hintT);otext('Слаймы прыгают на лугу к востоку →',VW/2,VH-14,7,'#fff0d0');cx.globalAlpha=1}
  if(banner){cx.globalAlpha=Math.min(1,banner.t*2);otext(banner.s,VW/2,VH*.32,10,'#ffd27a');cx.globalAlpha=1}
  if(P.dead>0)otext('Герой устал…',VW/2,VH/2,11,'#ffe0c0');
}

// ---------- loop ----------
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(running&&!paused)update(dt);render();requestAnimationFrame(loop)}
camX=Math.max(0,Math.min(MW*T-VW,P.x-VW/2));camY=Math.max(0,Math.min(MH*T-VH,P.y-8-VH/2));
requestAnimationFrame(loop);
</script>
